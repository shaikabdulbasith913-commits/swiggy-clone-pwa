<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fc8019" />
  <meta name="description" content="Swiggy-like food delivery app prototype — browse restaurants, order food and track deliveries." />
  <title>Foodie — Food Delivery</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/app-icon.svg" />
  <link rel="apple-touch-icon" href="icons/app-icon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="device-frame">
    <div id="app" aria-live="polite"></div>
    <div id="toast-region" class="toast-region" aria-live="assertive"></div>
    <div id="sheet-root"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () { /* works fine without SW */ });
      });
    }
  </script>
</body>
</html>
